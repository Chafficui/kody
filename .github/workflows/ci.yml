name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10

      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared (needed for typecheck of dependents)
        run: pnpm --filter @kody/shared run build

      - name: Typecheck all packages
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10

      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared and widget
        run: |
          pnpm --filter @kody/shared run build
          pnpm --filter @kody/widget run build

      - name: Check widget bundle size
        run: |
          GZIP_SIZE=$(gzip -c packages/widget/dist/kody.js | wc -c)
          GZIP_KB=$((GZIP_SIZE / 1024))
          echo "Widget gzipped size: ${GZIP_SIZE} bytes (${GZIP_KB}KB)"
          if [ "$GZIP_SIZE" -gt 30720 ]; then
            echo "::error::Widget bundle exceeds 30KB gzip limit (${GZIP_SIZE} bytes)"
            exit 1
          fi

  hosting-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22

      - name: Check for hosting-boundary leaks
        run: node scripts/check-hosting-leaks.mjs

